<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>梅園塔位方位查詢｜重生禮儀</title>
<meta name="description" content="輸入冬山梅園塔位號碼，查出坐東、坐西、坐南或坐北。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rebirth-yilan.vercel.app/meiyuan.html">
<meta property="og:title" content="梅園塔位方位查詢｜重生禮儀">
<meta property="og:description" content="輸入冬山梅園塔位號碼，查出坐東、坐西、坐南或坐北。 聯絡 簡文彥 0922-382533">
<meta property="og:image" content="https://rebirth-yilan.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#f7f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap">
<style>
  /* 梅園塔位方位查詢（負責人 2026-10-14 併入）：功能與對照表照原工具，外觀改為 D-1a 和風；負責人要求簡單介面，不放「坐向」小字、四格坐向與聯絡區 */
  :root {
    --washi: #f7f4ef; --paper: #ffffff; --line: #d9d2c7; --line-2: #e9e4dc;
    --sumi: #2a2623; --nezumi: #6b645e; --kaki: #a5512c; --enji: #7e2f26;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--washi); color: var(--sumi); font-family: var(--sans); font-size: 17px; line-height: 1.7; }
  .page { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 40px); }
  .back { display: inline-flex; align-items: center; min-height: 48px; color: var(--nezumi); text-decoration: none; font-size: 15px; letter-spacing: 1px; }
  .head { display: flex; align-items: center; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .mark { flex: none; width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--kaki); color: var(--kaki); font-family: var(--serif); font-weight: 900; font-size: 25px; line-height: 1; }
  .brand { margin: 0 0 4px; font-family: var(--serif); font-size: 12px; letter-spacing: 6px; color: var(--kaki); line-height: 1; }
  h1 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: 1px; line-height: 1.25; }
  .lead { margin: 18px 0 0; font-size: 17px; }

  .card { margin-top: 22px; background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--kaki); border-radius: 0 4px 4px 0; padding: 18px 16px; }
  label { display: block; margin-bottom: 8px; font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  input { display: block; width: 100%; min-height: 52px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--washi); color: var(--sumi); font: inherit; font-size: 20px; letter-spacing: 2px; }
  .primary { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-top: 12px; border: 0; border-radius: 3px; background: var(--enji); color: #fff; font-family: var(--serif); font-size: 19px; font-weight: 900; letter-spacing: 3px; cursor: pointer; }  /* 主要按鈕＝臙脂（負責人指定配色） */
  .hint { margin: 8px 0 0; font-size: 15px; color: var(--nezumi); }
  .warn { margin: 12px 0 0; padding: 8px 12px; background: #f4e7e3; border: 1px solid #c9a59d; border-radius: 3px; color: var(--enji); font-size: 16px; font-weight: 700; }

  .result { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-2); }
  .result-dir { margin: 0; font-family: var(--serif); font-size: 40px; font-weight: 900; color: var(--enji); letter-spacing: 4px; line-height: 1.3; }
  .result-basis { margin: 2px 0 0; font-size: 15px; color: var(--nezumi); }

  details { margin-top: 22px; border-top: 1px solid var(--line-2); }
  summary { cursor: pointer; min-height: 52px; display: flex; align-items: center; font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--kaki); }
  .group { margin: 12px 0 0; }
  .group h2 { margin: 0 0 6px; font-family: var(--serif); font-size: 16px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-variant-numeric: tabular-nums; font-size: 15px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--washi); }
  .note { margin: 18px 0 0; font-size: 14px; color: var(--nezumi); }

  footer { margin-top: 36px; text-align: center; font-family: var(--serif); font-size: 13px; letter-spacing: 6px; color: var(--nezumi); }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--enji); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="./">← 重生禮儀</a>
  <div class="head">
    <span class="mark" aria-hidden="true">梅</span>
    <div><p class="brand">重 生 禮 儀</p><h1>梅園塔位方位查詢</h1></div>
  </div>

  <p class="lead">輸入冬山梅園的塔位號碼，即可查出坐向。</p>

  <div class="card">
    <form id="f" autocomplete="off">
      <label for="code">塔位號碼</label>
      <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false"
             placeholder="例如 1E0612xxxx" maxlength="20">
      <button type="submit" class="primary">查詢坐向</button>
    </form>

    <p id="err" class="warn" hidden></p>
    <p id="len" class="warn" hidden></p>

    <section id="out" class="result" hidden aria-live="polite">
      <p id="dir" class="result-dir"></p>
      <p id="basis" class="result-basis"></p>
    </section>

    <details>
      <summary>查看全部對照表</summary>
      <div id="all"></div>
    </details>
  </div>

  <p class="note">對照表依提供之梅園塔位清單整理。1E06 與 1E0612 等較長的號碼優先比對，所以先看 6 碼，再看 4 碼。</p>

  <footer>重 生 禮 儀</footer>
</main>

<script>
/* 以下功能與對照表照搬負責人原本的「梅園塔位方位查詢」（2026-10-14），對照表不可自行增改。 */
const DIRS = ["坐東", "坐西", "坐南", "坐北"];

const DATA = {
  "坐東": ["1A01","1A03","1C01","1C03","1C06","1C08","1C10",
           "1E01","1E03","1E06","1E08","1E10","1E12","1E15","1E17","1E19",
           "1F01","1F03","1F06","1F08","1F10","1F12","1F15","1F17","1F19"],
  "坐西": ["1A02","1A05","1C02","1C05","1C07","1C09",
           "1E02","1E05","1E07","1E09","1E11","1E13","1E16","1E18",
           "1F02","1F05","1F07","1F09","1F11","1F13","1F16","1F18","1F20"],
  "坐南": ["1D01","1D03","1D06","1D08","1D10","1D12",
           "1E0612","1E0613","1E0811","1E0812"],
  "坐北": ["1D02","1D05","1D07","1D09","1D11","1D13"]
};

const MAP = new Map();
for (const dir of DIRS) for (const key of DATA[dir]) MAP.set(key, dir);

function normalize(s) {
  return s.toUpperCase().replace(/[\s\-‐－]/g, "").replace(/I/g, "1");
}

function lookup(code) {
  for (let n = 6; n >= 4; n--) {
    const prefix = code.slice(0, n);
    if (prefix.length === n && MAP.has(prefix)) return { dir: MAP.get(prefix), key: prefix };
  }
  return null;
}

const $ = (id) => document.getElementById(id);

function show(id, text) {
  const el = $(id);
  el.textContent = text || "";
  el.hidden = !text;
}

function render(dir, key) {
  $("dir").textContent = dir;
  $("basis").textContent = "依前綴 " + key + " 判定";
  $("out").hidden = false;
}

function buildAll() {
  const all = $("all");
  all.replaceChildren();
  for (const dir of DIRS) {
    const g = document.createElement("div");
    g.className = "group";
    const h = document.createElement("h2");
    h.textContent = dir + "（" + DATA[dir].length + " 組）";
    const chips = document.createElement("div");
    chips.className = "chips";
    for (const key of DATA[dir]) {
      const s = document.createElement("span");
      s.textContent = key;
      chips.appendChild(s);
    }
    g.append(h, chips);
    all.appendChild(g);
  }
}

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = $("code").value;
  const code = normalize(raw);

  show("err", "");
  show("len", "");
  $("out").hidden = true;

  if (!code) {
    show("err", "請輸入塔位號碼。");
    return;
  }
  if (!/^[A-F0-9]+$/.test(code)) {
    show("err", "號碼只能包含英文字母 A–F 與數字，請再確認。");
    return;
  }
  if (code.length < 4) {
    show("err", "請至少輸入前 4 碼。");
    return;
  }

  const hit = lookup(code);
  if (!hit) {
    show("err", "查無此塔位的坐向資料，請確認號碼前 4–6 碼是否正確。");
    return;
  }

  if (code.length < 8 || code.length > 10) {
    show("len", "一般號碼為 8–10 碼，目前輸入 " + code.length + " 碼，請確認是否完整。");
  }
  render(hit.dir, hit.key);
});

buildAll();
</script>
</body>
</html>
