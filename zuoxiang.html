<script>
const DIRS = ["坐東", "坐西", "坐南", "坐北"];

// 產生連號：rng("2D12", 1, 7) → 2D1201 … 2D1207
function rng(prefix, from, to) {
  const out = [];
  for (let i = from; i <= to; i++) out.push(prefix + String(i).padStart(2, "0"));
  return out;
}

// 三樓塔位（3 開頭）
const FLOOR3 = {
  "坐東": ["3A01","3A03","3A06","3A08","3A10","3A12","3A15","3A17","3A19",
           "3C01","3C03","3C06","3C17",
           "3D01","3D03","3D06","3D08","3D10","3D12","3D15","3D17","3D19"],
  "坐西": ["3A02","3A05","3A07","3A09","3A11","3A13","3A16","3A18",
           "3C02","3C05","3C16",
           "3D02","3D05","3D07","3D09","3D11","3D13","3D16","3D18","3D20"],
  "坐南": ["3B01","3B03","3B06","3B08","3B10","3B12",
           "3C08","3C10","3C12","3C15"],
  "坐北": ["3B02","3B05","3B07","3B09","3B11","3B13",
           "3C07","3C09","3C11","3C13"]
};

const TOWER = {
  "坐東": [...FLOOR3["坐東"], "1A01","1A03","1C01","1C03","1C06","1C08","1C10",
           "1E01","1E03","1E06","1E08","1E10","1E12","1E15","1E17","1E19",
           "1F01","1F03","1F06","1F08","1F10","1F12","1F15","1F17","1F19",
           "2A01","2A03","2A06","2A08","2A10","2A12","2A15","2A17","2A19",
           "2C02","2C05","2C07","2C09","2C11","2C13","2C16","2C18","2C20",
           "2D01","2D03","2D06","2D08","2D10",
           ...rng("2D12", 8, 10), ...rng("2D13", 8, 10),
           ...rng("2D15", 8, 10), ...rng("2D16", 8, 10)],
  "坐西": [...FLOOR3["坐西"], "1A02","1A05","1C02","1C05","1C07","1C09",
           "1E02","1E05","1E07","1E09","1E11","1E13","1E16","1E18",
           "1F02","1F05","1F07","1F09","1F11","1F13","1F16","1F18","1F20",
           "2A02","2A05","2A07","2A09","2A11","2A13","2A16","2A18",
           "2C03","2C06","2C08","2C10","2C12","2C15","2C17","2C19","2C21","2C22",
           "2D02","2D05","2D07","2D09","2D11"],
  "坐南": [...FLOOR3["坐南"], "1D01","1D03","1D06","1D08","1D10","1D12",
           "1E0612","1E0613","1E0811","1E0812",
           "2B01","2B03","2B06","2B08","2B10","2B12",
           "2C01",
           ...rng("2D12", 11, 17), ...rng("2D13", 11, 17),
           ...rng("2D15", 11, 17), ...rng("2D16", 11, 17)],
  "坐北": [...FLOOR3["坐北"], "1D02","1D05","1D07","1D09","1D11","1D13",
           "2B02","2B05","2B07","2B09","2B11","2B13",
           ...rng("2D12", 1, 7), ...rng("2D13", 1, 7),
           ...rng("2D15", 1, 7), ...rng("2D16", 1, 7)]
};

// 牌位區（2E 開頭）
const SHRINE = {
  "坐東": ["2E01"],
  "坐西": ["2E03"],
  "坐南": [],
  "坐北": ["2E02"]
};

// 一樓牌位區（1B 開頭，負責人 2026-10-16 提供手寫「一樓牌位」表）
// 同一排會分屬兩個方向（例如 1B0101 的 01–20 坐東、21–26 坐南），所以要看到第 8 碼。
// 寫法「排:起-迄」，例 "0101:21-26" ＝ 1B010121～1B010126。
// 手寫表「東南（南）」＝坐東南偏南，記為坐南；西北（北）＝西北偏北、東北（東）＝東北偏東、西南（西）＝西南偏西（負責人 2026-10-16 說明）。
// 手寫不清的兩處依前後排對照判讀並經負責人確認：1B011223-230、1B030507-513。
const SHRINE_1B = [
  { dir: "坐南", label: "東南偏南", rows:
    "0101:21-26 0102:22-28 0103:22-28 0105:22-29 0106:23-30 0107:23-30 0108:21-26 " +
    "0109:22-28 0110:22-28 0111:22-29 0112:23-30 0113:23-30 " +
    "0201:01-07 0202:01-07 0203:01-08 0205:01-08 0206:01-09 0207:01-09 0208:01-07 " +
    "0209:01-07 0210:01-08 0211:01-08 0212:01-09 0213:01-09" },
  { dir: "坐北", label: "西北偏北", rows:
    "0301:06-11 0302:06-11 0303:07-13 0305:07-13 0306:07-15 0307:08-16 0308:06-11 " +
    "0309:06-11 0310:07-13 0311:07-13 0312:07-15 0313:08-16 " +
    "0501:01-06 0502:01-07 0503:01-07 0505:01-08 0506:01-08 0507:01-08 0508:01-06 " +
    "0509:01-07 0510:01-07 0511:01-08 0512:01-08 0513:01-08" },
  { dir: "坐東", label: "東北偏東", rows:
    "0101:01-20 0102:01-21 0103:01-21 0105:01-21 0106:01-22 0107:01-22 0108:01-20 " +
    "0109:01-21 0110:01-21 0111:01-21 0112:01-22 0113:01-22 " +
    "0501:07-10 0502:08-11 0503:08-12 0505:09-13 0506:09-13 0507:09-15 0508:07-10 " +
    "0509:08-11 0510:08-12 0511:09-13 0512:09-13 0513:09-15" },
  { dir: "坐西", label: "西南偏西", rows:
    "0201:08-27 0202:08-28 0203:09-29 0205:09-30 0206:10-31 0207:10-31 0208:08-27 " +
    "0209:08-28 0210:09-29 0211:09-30 0212:10-31 0213:10-31 " +
    "0301:01-05 0302:01-05 0303:01-06 0305:01-06 0306:01-06 0307:01-07 0308:01-05 " +
    "0309:01-05 0310:01-06 0311:01-06 0312:01-06 0313:01-07" }
];
// 展開成 { "1B0101": [{ from, to, dir, label }, …] }
const RANGES_1B = {};
for (const g of SHRINE_1B) {
  for (const item of g.rows.split(" ")) {
    const [row, span] = item.split(":");
    const [from, to] = span.split("-").map(Number);
    (RANGES_1B["1B" + row] = RANGES_1B["1B" + row] || []).push({ from, to, dir: g.dir, label: g.label, row });
  }
}
const pad2 = (n) => String(n).padStart(2, "0");

const TABLES = { "塔位": TOWER, "牌位": SHRINE };
const MAPS = { "塔位": new Map(), "牌位": new Map() };
for (const type of Object.keys(TABLES)) {
  for (const dir of DIRS) for (const key of TABLES[type][dir]) MAPS[type].set(key, dir);
}

let mode = "塔位";
// 園區：網址帶 ?park=壽園 時為壽園（福恩塔），其餘為梅園（預設）
let PARK = new URLSearchParams(location.search).get("park") === "壽園" ? "壽園" : "梅園";
let tower = "福恩塔";

function normalize(s) {
  return s.toUpperCase().replace(/[\s\-‐－]/g, "").replace(/I/g, "1");
}

function lookup(code, type) {
  // 一樓牌位 1B：看前 6 碼找排，再看第 7–8 碼落在哪一段
  if (type === "牌位" && code.startsWith("1B")) {
    const list = RANGES_1B[code.slice(0, 6)];
    if (!list) return null;
    if (code.length < 8) return { need8: true, type };
    const n = Number(code.slice(6, 8));
    const r = list.find((x) => n >= x.from && n <= x.to);
    if (!r) return null;
    const head = "1B" + r.row;
    return { dir: r.dir, key: head + pad2(r.from) + "～" + head + pad2(r.to), type, label: r.label };
  }
  for (let n = 6; n >= 4; n--) {
    const prefix = code.slice(0, n);
    if (prefix.length === n && MAPS[type].has(prefix)) {
      return { dir: MAPS[type].get(prefix), key: prefix, type };
    }
  }
  return null;
}

const $ = (id) => document.getElementById(id);

function show(id, text) {
  const el = $(id);
  el.textContent = text || "";
  el.hidden = !text;
}

function setMode(type) {
  if (PARK === "壽園") return fuSetMode(type);
  mode = type;
  for (const b of document.querySelectorAll(".seg-btn")) {
    b.setAttribute("aria-pressed", b.dataset.type === type ? "true" : "false");
  }
  $("lbl").textContent = type + "號碼";
  $("code").placeholder = type === "塔位" ? "例如 1E0612xxxx" : "例如 1B010125xx 或 2E03xxxx";
  show("err", "");
  show("len", "");
  $("out").hidden = true;
}

function render(dir, key, type, label) {
  $("dir").textContent = dir;
  $("basis").textContent = label
    ? type + "・坐" + label + "・依 " + key + " 判定"
    : type + "・依前綴 " + key + " 判定";
  $("out").hidden = false;
}

function buildAll() {
  const all = $("all");
  all.replaceChildren();
  for (const type of ["塔位", "牌位"]) {
    const src = TABLES[type];
    // 牌位另外列出一樓 1B 的號碼範圍（例「1B010121～26」）
    const extra = {};
    for (const d of DIRS) extra[d] = [];
    if (type === "牌位") {
      for (const g of SHRINE_1B) for (const item of g.rows.split(" ")) {
        const [row, span] = item.split(":");
        const [f, t] = span.split("-");
        extra[g.dir].push("1B" + row + f + "～" + t);
      }
    }
    const count = DIRS.reduce((n, d) => n + src[d].length + extra[d].length, 0);
    const sec = document.createElement("div");
    sec.className = "group";
    const sh = document.createElement("h2");
    sh.textContent = type + "區（" + count + " 組）";
    sec.appendChild(sh);
    for (const dir of DIRS) {
      const keys = extra[dir].concat(src[dir]);
      if (!keys.length) continue;
      const g = document.createElement("div");
      g.className = "group";
      const h = document.createElement("h3");
      h.textContent = dir + "（" + keys.length + " 組）";
      const chips = document.createElement("div");
      chips.className = "chips";

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (PARK === "壽園") return fuSubmit();
  const code = normalize($("code").value);

  show("err", "");
  show("len", "");
  $("out").hidden = true;

  if (!code) {
    show("err", "請輸入" + mode + "號碼。");
    return;
  }
  if (!/^[A-F0-9]+$/.test(code)) {
    show("err", "號碼只能包含英文字母 A–F 與數字，請再確認。");
    return;
  }
  if (code.length < 4) {
    show("err", "請至少輸入前 4 碼。");
    return;
  }

  const hit = lookup(code, mode);
  if (!hit) {
    const other = mode === "塔位" ? "牌位" : "塔位";
    if (lookup(code, other)) {
      show("err", "此號碼屬於" + other + "，請先切換到「" + other + "」再查詢。");
    } else {
      show("err", "查無此" + mode + "的坐向資料，請確認號碼前 " + (code.startsWith("1B") ? "8" : "4–6") + " 碼是否正確。");
    }
    return;
  }
  if (hit.need8) {
    show("err", "一樓牌位（1B 開頭）同一排分屬兩個方向，請輸入前 8 碼，例如 1B010125。");
    return;
  }

  if (code.length < 8 || code.length > 10) {
    show("len", "一般號碼為 8–10 碼，目前輸入 " + code.length + " 碼，請確認是否完整。");
  }
  render(hit.dir, hit.key, hit.type, hit.label);
});

function baoFloorOf(code) {
  if (code === "B1A") return "地下一樓";
  return { "1": "一樓", "2": "二樓", "3": "三樓", "5": "五樓" }[code[0]] || "";

const BAO_TOWER_CFG = {
  label: "塔位號碼", placeholder: "例如 2C02、1BF18",
  hint: "格式：代號加兩位面號，例如 2C02。地下一樓第 15 面要再加三位號碼，例如 B1A15151。",
  lenWarn: false,
  validate: null,
  lookup(code) {
    const m = code.replace(/-/g, "").match(/^(B1A|1BF|1AF|2[ABCD]|3[EFGH]|5[KL])(\d{2})(\d{3})?$/);
    if (!m) return { error: "格式應為代號加兩位面號，例如 2C02；地下一樓第 15 面還要加三位號碼，例如 B1A15151。" };
    const key = m[1] + m[2];
    if (key === "B1A15") {
      if (!m[3]) return { error: "地下一樓第 15 面要再輸入三位號碼，例如 B1A15151。" };
      const num = parseInt(m[3], 10);
      for (const dir of DIRS) {
        if ((BAO_B1A15[dir] || []).some(([a, b]) => num >= a && num <= b)) {
          return { dir, basis: "寶塔塔位・地下一樓 第 15 面 " + num + " 號" };
        }
      }
      return { error: "查無此號，地下一樓第 15 面沒有 " + m[3] + " 號。" };
    }
    if (m[3]) return { error: "此面只需填到面，例如 " + key + "。" };
    const dir = BAO_TOWER_MAP.get(key);
    if (!dir) return { error: "查無此面（" + key + "），請確認代號與面號。" };
    return { dir, basis: "寶塔塔位・" + baoFloorOf(m[1]) + " " + key + " 面" };
  }
};

const BAO_SHRINE_CFG = {
  label: "牌位號碼", placeholder: "例如 AE0101、B0101",
  hint: "格式：代號加兩位面號、兩位號碼，例如 AE0101、B0101、東0101。",

  validate: null,
  lookup(code) {
    const m = code.match(/^(BE|BW|AE|AW|AN|B|東|西)(\d{2})(\d{2})$/);
    if (!m) return { error: "格式應為代號加兩位面號、兩位號碼，例如 AE0101。" };
    const num = parseInt(m[3], 10);
    let hitCode = false;
    let hitFace = false;
    for (const [c, dir, faces, from, to] of BAO_SHRINE_LIST) {
      if (c !== m[1]) continue;
      hitCode = true;
      if (!faces.includes(m[2])) continue;
      hitFace = true;
      if (num >= from && num <= to) {
        return { dir, basis: "寶塔牌位・一樓 " + m[1] + " 第 " + parseInt(m[2], 10) + " 面 " + num + " 號" };
      }
    }
    if (!hitCode) return { error: "查無此代號（" + m[1] + "）。" };
    if (!hitFace) return { error: "查無此面（" + m[1] + m[2] + "）。" };
    return { error: "查無此號，" + m[1] + m[2] + " 面沒有 " + num + " 號。" };

};

function baoBuildAll(all) {
  const isTower = mode === "塔位";
  const h = document.createElement("h2");
  h.textContent = "寶塔・" + mode + "區";
  all.appendChild(h);
  for (const d of DIRS) {
    const items = isTower ? BAO_TOWER_ITEMS[d] : BAO_SHRINE_ITEMS[d];
    const count = isTower ? items.length : BAO_SHRINE_COUNT[d];
    const unit = isTower ? "面" : "個";
    const g = document.createElement("div");
    g.className = "group";
    const h3 = document.createElement("h3");
    h3.className = "bao-dir";
    h3.textContent = items.length ? DIR_LABEL[d] + "（" + count + " " + unit + "）" : DIR_LABEL[d] + "（無）";
    g.appendChild(h3);
    if (items.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const t of items) {
        const sp = document.createElement("span");
        sp.textContent = t;
        chips.appendChild(sp);
      }
      g.appendChild(chips);
      if (isTower && BAO_B1A15[d]) {
        const p = document.createElement("p");
        p.textContent = "地下一樓第 15 面號碼：" + BAO_B1A15[d].map(([a, b]) => a + "～" + b).join("、");
        g.appendChild(p);
      }
    }
    all.appendChild(g);
  }
}

function fuCfg() {
  if (tower === "寶塔") return mode === "塔位" ? BAO_TOWER_CFG : BAO_SHRINE_CFG;
  return mode === "塔位" ? FU_TOWER : FU_SHRINE_CFG;
}

function fuSetMode(type) {
  mode = type;
  fuSync();
}

function fuSync() {
  const built = tower === "福恩塔" || tower === "寶塔";
  for (const b of document.querySelectorAll(".seg-btn")) {
    b.setAttribute("aria-pressed", b.dataset.type === mode ? "true" : "false");
  }
  for (const b of document.querySelectorAll(".tower-btn")) {
    b.setAttribute("aria-pressed", b.dataset.tower === tower ? "true" : "false");
  }
  $("typeSeg").hidden = !built;
  $("f").hidden = !built;
  $("notice").hidden = built;
  $("details").hidden = !built;
  if (built) {
    const cfg = fuCfg();
    $("lbl").textContent = cfg.label;
    $("code").placeholder = cfg.placeholder;
    $("hint").textContent = cfg.hint;
  }
  $("code").value = "";
  show("err", "");
  show("len", "");
  $("out").hidden = true;
  fuBuildAll();
}

function fuSubmit() {
  show("err", "");
  show("len", "");
  $("out").hidden = true;
  if (tower !== "福恩塔" && tower !== "寶塔") return;
  const code = normalize($("code").value);
  if (!code) {
    show("err", "請輸入" + mode + "號碼。");
    return;
  }
  const r = fuCfg().lookup(code);
  if (r.error) {
    show("err", r.error);
    return;
  }
  $("dir").textContent = tower === "寶塔" ? DIR_LABEL[r.dir] : r.dir;
  $("basis").textContent = r.basis;
  $("out").hidden = false;
}

function fuBuildAll() {
  const all = $("all");
  all.replaceChildren();
  if (tower === "寶塔") return baoBuildAll(all);
  if (tower !== "福恩塔") return;
  const isTower = mode === "塔位";
  const h = document.createElement("h2");
  h.textContent = "福恩塔・" + mode + "區";
  all.appendChild(h);
  for (const d of DIRS) {
    const items = isTower ? FU_TOWER_BY_DIR[d] : (FU_SHRINE_ITEMS[d] || []);
    const count = isTower ? items.length : (FU_SHRINE_COUNT[d] || 0);
    const unit = isTower ? "組" : "個";
    const g = document.createElement("div");
    g.className = "group";
    const h3 = document.createElement("h3");
    h3.textContent = items.length ? d + "（" + count + " " + unit + "）" : d + "（無）";
    g.appendChild(h3);
    if (items.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const t of items) {
        const sp = document.createElement("span");
        sp.textContent = t;
        chips.appendChild(sp);
      }
      g.appendChild(chips);
    }
    all.appendChild(g);
  }
}

let towerBound = false;

function initFuPark() {
  document.title = "壽園塔位方位查詢｜重生禮儀";
  $("mark").textContent = "壽";
  $("pageTitle").textContent = "壽園塔位方位查詢";
  $("lead").textContent = "輸入壽園福恩塔的塔位或牌位號碼，即可查出坐向。";
  $("note").textContent = "福恩塔塔位格式為樓層區塊加兩位組別，再加三位號碼，例如 F1B03123；牌位格式為 FA 加方位字、層數與號碼，例如 FA東0101。";
  $("towerSeg").hidden = false;
  $("code").value = "";
  mode = "塔位";
  if (!towerBound) {
    towerBound = true;
    for (const b of document.querySelectorAll(".tower-btn")) {
      b.addEventListener("click", () => { tower = b.dataset.tower; fuSync(); });
    }
  }
  tower = "福恩塔";
  fuSync();
}

function initMeiyuanPark() {
  document.title = DEFAULTS.docTitle;
  $("mark").textContent = DEFAULTS.mark;
  $("pageTitle").textContent = DEFAULTS.title;
  $("lead").textContent = DEFAULTS.lead;
  $("note").textContent = DEFAULTS.note;
  $("hint").textContent = DEFAULTS.hint;
  $("towerSeg").hidden = true;
  $("typeSeg").hidden = false;
  $("notice").hidden = true;
  $("f").hidden = false;
  $("details").hidden = false;
  $("code").value = "";
  mode = "塔位";
  setMode("塔位");
  buildAll();
}

function setPark(p) {
  PARK = p;
  for (const b of document.querySelectorAll(".park[data-park]")) {
    const on = b.dataset.park === p;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  const q = new URLSearchParams(location.search);
  q.set("park", p);
  history.replaceState(null, "", "?" + q.toString());
  if (p === "壽園") initFuPark(); else initMeiyuanPark();
}

const DEFAULTS = {
  lead: $("lead").textContent, note: $("note").textContent, hint: $("hint").textContent,
  title: "梅園塔位方位查詢", mark: "梅", docTitle: "梅園塔位方位查詢"
};
for (const b of document.querySelectorAll(".park[data-park]")) {
  b.addEventListener("click", () => setPark(b.dataset.park));
}
setPark(PARK);

// 嵌入模式：把頁面高度告訴外層，讓外層框架跟著長高，不會出現框中框的捲動
if (document.documentElement.classList.contains('embed') && window.parent !== window) {
  // 用內容本身的高度（不是框的高度），對照表展開、收起時外框才會跟著變
  const postHeight = () => window.parent.postMessage({ meiyuanHeight: Math.ceil(document.querySelector('.page').getBoundingClientRect().height) }, '*');
  new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener('load', postHeight);
  postHeight();
}
</script>
</body>
