<style>
  /* 重生禮儀 公開首頁：D-1a 和風（和紙底、細線、明朝體、漢字標記），與系統工具同一套配色 */
  :root {
    --washi: #f7f4ef; --paper: #ffffff; --line: #d9d2c7; --line-2: #e9e4dc;
    --sumi: #2a2623; --nezumi: #6b645e; --kaki: #a5512c; --enji: #7e2f26;
    --line-green: #06c755;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--washi); color: var(--sumi); font-family: var(--sans); font-size: 17px; line-height: 1.7; }
  .page { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 40px); display: flex; flex-direction: column; gap: 26px; }

  .brand { margin: 0; font-family: var(--serif); font-size: 13px; letter-spacing: 6px; color: var(--kaki); }
  h1 { margin: 0; font-family: var(--serif); font-size: 34px; font-weight: 700; letter-spacing: 8px; line-height: 1.25; }
  .logo { margin: 0; line-height: 0; }

  .lead { margin: 0; color: var(--nezumi); }
  .rule { height: 1px; background: var(--line); }

  h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .tools { display: flex; flex-direction: column; gap: 12px; }
  .tool { display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: inherit; }
  .tool:active { background: #fbf9f5; }
  .mark { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid var(--kaki); color: var(--kaki); font-family: var(--serif); font-weight: 900; font-size: 27px; line-height: 1; }
  .tool-txt { flex: 1; min-width: 0; }
  .tool-txt b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .tool-txt span { display: block; font-size: 15px; color: var(--nezumi); line-height: 1.55; margin-top: 2px; }
  .arrow { flex: none; color: var(--kaki); font-size: 20px; }

  .contact { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--enji); border-radius: 0 4px 4px 0; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .contact .who { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .contact .tel { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--enji); letter-spacing: 1px; text-decoration: none; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { flex: 1 1 140px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; min-height: 52px; padding: 0 16px; border-radius: 3px; font-family: var(--serif); font-size: 17px; font-weight: 900; letter-spacing: 1px; text-decoration: none; }
  .btn.call { background: #f4e7e3; color: var(--enji); border: 1px solid #c9a59d; }  /* 淡臙脂底・深紅字（負責人選 R1） */
  .btn.line { background: #e4edde; color: #3d5a35; border: 1px solid #9db592; letter-spacing: 0; padding: 0 10px; }  /* 淡綠底・深綠字（負責人選 B2） */
  .ico { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; }

  footer { text-align: center; font-family: var(--serif); font-size: 13px; letter-spacing: 6px; color: var(--nezumi); }
  a:focus-visible { outline: 2px solid var(--enji); outline-offset: 2px; }
</style>
